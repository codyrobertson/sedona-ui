<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Risograph Chart — Compound Interest</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { display: flex; min-height: 100vh; background: #d6d0c4; font-family: 'Inter', system-ui, sans-serif; }
    .chart-area { flex: 1; display: flex; justify-content: center; align-items: center; }
    .chart-wrap { width: 720px; height: 720px; padding: 16px; }
    canvas { width: 100% !important; height: 100% !important; }
    .cp { width: 300px; background: #1a1a1a; color: #ccc; overflow-y: auto; padding: 16px 14px; font-size: 12px; border-left: 1px solid #333; flex-shrink: 0; }
    .cp h2 { font-family: 'DM Serif Display', Georgia, serif; font-size: 16px; color: #fff; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #333; }
    .cs { margin-bottom: 16px; }
    .cs h3 { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.2px; color: #888; margin-bottom: 8px; }
    .cr { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .cr label { width: 90px; flex-shrink: 0; font-size: 11px; color: #999; }
    .cr input[type="range"] { flex: 1; accent-color: #6b93d6; height: 4px; }
    .cr .v { width: 40px; text-align: right; font-size: 10px; color: #666; font-variant-numeric: tabular-nums; }
    .cr input[type="color"] { width: 28px; height: 22px; border: 1px solid #444; border-radius: 3px; background: none; cursor: pointer; padding: 0; }
    .cr input[type="color"]::-webkit-color-swatch-wrapper { padding: 1px; }
    .cr input[type="color"]::-webkit-color-swatch { border: none; border-radius: 2px; }
    .cr input[type="checkbox"] { accent-color: #6b93d6; }
    .btn { width: 100%; padding: 6px; background: #2a2a2a; color: #999; border: 1px solid #444; border-radius: 4px; font-size: 11px; cursor: pointer; margin-top: 8px; }
    .btn:hover { background: #333; color: #ccc; }
    .ct-btn.active { background: #3a5a8a; color: #fff; border-color: #5a7aaa; }
  </style>
</head>
<body>
  <div class="chart-area"><div class="chart-wrap"><canvas id="chart"></canvas></div></div>

  <div class="cp">
    <h2>Risograph Config</h2>

    <div class="cs"><h3>Chart Type</h3>
      <div class="cr" style="gap:4px;">
        <button class="btn ct-btn active" data-type="line" style="flex:1;margin:0;padding:4px;">Line</button>
        <button class="btn ct-btn" data-type="bar" style="flex:1;margin:0;padding:4px;">Bar</button>
        <button class="btn ct-btn" data-type="scatter" style="flex:1;margin:0;padding:4px;">Scatter</button>
        <button class="btn ct-btn" data-type="doughnut" style="flex:1;margin:0;padding:4px;">Donut</button>
      </div>
    </div>

    <div class="cs"><h3>Halftone</h3>
      <div class="cr"><label>Color</label><input type="color" id="ht-color" value="#6b93d6"></div>
      <div class="cr"><label>Cell Size</label><input type="range" id="ht-cs" min="1" max="8" step="0.5" value="3"><span class="v" id="ht-cs-v">3</span></div>
      <div class="cr"><label>Max Dot</label><input type="range" id="ht-md" min="0.5" max="5" step="0.1" value="2.0"><span class="v" id="ht-md-v">2.0</span></div>
      <div class="cr"><label>Bleed</label><input type="range" id="ht-bl" min="0" max="0.15" step="0.005" value="0.04"><span class="v" id="ht-bl-v">0.04</span></div>
      <div class="cr"><label>Sq Threshold</label><input type="range" id="ht-sq" min="0" max="0.6" step="0.02" value="0.30"><span class="v" id="ht-sq-v">0.30</span></div>
      <div class="cr"><label>Density Power</label><input type="range" id="ht-dp" min="0.5" max="3" step="0.1" value="1.3"><span class="v" id="ht-dp-v">1.3</span></div>
      <div class="cr"><label>Density Floor</label><input type="range" id="ht-df" min="0" max="0.5" step="0.01" value="0.08"><span class="v" id="ht-df-v">0.08</span></div>
      <div class="cr"><label>Line Width</label><input type="range" id="ht-lw" min="0.5" max="5" step="0.5" value="2.5"><span class="v" id="ht-lw-v">2.5</span></div>
    </div>

    <div class="cs"><h3>Paper</h3>
      <div class="cr"><label>Color</label><input type="color" id="p-color" value="#f0ebe1"></div>
      <div class="cr"><label>Fiber</label><input type="range" id="p-fb" min="0" max="1" step="0.05" value="0.45"><span class="v" id="p-fb-v">0.45</span></div>
      <div class="cr"><label>Fiber Angle</label><input type="range" id="p-fa" min="-0.5" max="0.5" step="0.05" value="0.15"><span class="v" id="p-fa-v">0.15</span></div>
      <div class="cr"><label>Tooth</label><input type="range" id="p-to" min="0" max="1" step="0.05" value="0.35"><span class="v" id="p-to-v">0.35</span></div>
      <div class="cr"><label>Grain</label><input type="range" id="p-gr" min="0" max="0.6" step="0.05" value="0.25"><span class="v" id="p-gr-v">0.25</span></div>
      <div class="cr"><label>Specks</label><input type="range" id="p-sp" min="0" max="0.01" step="0.001" value="0.003"><span class="v" id="p-sp-v">0.003</span></div>
      <div class="cr"><label>Warm Shift</label><input type="range" id="p-ws" min="0" max="0.15" step="0.01" value="0.10"><span class="v" id="p-ws-v">0.10</span></div>
    </div>

    <div class="cs"><h3>Layer 2 (Ink Pass)</h3>
      <div class="cr"><label>Enabled</label><input type="checkbox" id="l2-on"></div>
      <div class="cr"><label>Color</label><input type="color" id="l2-color" value="#e8a040"></div>
      <div class="cr"><label>Cell Size</label><input type="range" id="l2-cs" min="1" max="8" step="0.5" value="3"><span class="v" id="l2-cs-v">3</span></div>
      <div class="cr"><label>Max Dot</label><input type="range" id="l2-md" min="0.5" max="5" step="0.1" value="2.0"><span class="v" id="l2-md-v">2.0</span></div>
      <div class="cr"><label>Density Power</label><input type="range" id="l2-dp" min="0.5" max="3" step="0.1" value="1.3"><span class="v" id="l2-dp-v">1.3</span></div>
      <div class="cr"><label>Density Floor</label><input type="range" id="l2-df" min="0" max="0.5" step="0.01" value="0.15"><span class="v" id="l2-df-v">0.15</span></div>
      <div class="cr"><label>X Offset</label><input type="range" id="l2-ox" min="-5" max="5" step="0.5" value="0.5"><span class="v" id="l2-ox-v">0.5</span></div>
      <div class="cr"><label>Y Offset</label><input type="range" id="l2-oy" min="-5" max="5" step="0.5" value="-0.5"><span class="v" id="l2-oy-v">-0.5</span></div>
    </div>

    <div class="cs"><h3>Series</h3>
      <div class="cr"><label>Multi-Series</label><input type="checkbox" id="ms-on"></div>
    </div>

    <div class="cs"><h3>Animation</h3>
      <div class="cr"><label>Duration (s)</label><input type="range" id="a-dur" min="0.5" max="6" step="0.5" value="2.5"><span class="v" id="a-dur-v">2.5</span></div>
      <div class="cr"><label>Scrub</label><input type="range" id="a-scrub" min="0" max="1" step="0.005" value="1"><span class="v" id="a-scrub-v">1.00</span></div>
      <div style="display:flex;gap:6px;margin-top:4px;">
        <button class="btn" id="btn-play" style="flex:1;background:#2a4a2a;border-color:#4a6a4a;">Play</button>
        <button class="btn" id="btn-reset" style="flex:1;">Reset</button>
      </div>
    </div>

    <button class="btn" id="btn-defaults">Reset to Defaults</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="perlin.js"></script>
  <script src="risograph-plugin.js"></script>
  <script>
    // Data per chart type
    const lineData = []; for (let y = 0; y <= 24; y++) lineData.push({ x: y, y: 10000 * Math.pow(1.07, y) });
    const lineData2 = []; for (let y = 0; y <= 24; y++) lineData2.push({ x: y, y: 10000 * Math.pow(1.05, y) });
    const lineData3 = []; for (let y = 0; y <= 24; y++) lineData3.push({ x: y, y: 10000 * Math.pow(1.10, y) });
    const barData = { labels: ['Q1','Q2','Q3','Q4','Q1','Q2'], datasets: [{ data: [12,19,8,15,22,11], backgroundColor: 'rgba(0,0,0,0)', borderColor: 'rgba(0,0,0,0)', borderWidth: 0 }] };
    const barMultiData = { labels: ['Q1','Q2','Q3','Q4','Q1','Q2'], datasets: [
      { data: [12,19,8,15,22,11], backgroundColor: 'rgba(0,0,0,0)', borderColor: 'rgba(0,0,0,0)', borderWidth: 0, _risoColor: '#6b93d6' },
      { data: [8,14,12,10,18,15], backgroundColor: 'rgba(0,0,0,0)', borderColor: 'rgba(0,0,0,0)', borderWidth: 0, _risoColor: '#e8a040' },
    ] };
    const scatterData = { datasets: [{ data: Array.from({length:40}, (_,i) => ({ x: Math.random()*24, y: 10000+Math.random()*40000 })), backgroundColor: 'rgba(0,0,0,0)', borderColor: 'rgba(0,0,0,0)', pointRadius: 0, showLine: false }] };
    const scatterMultiData = { datasets: [
      { data: Array.from({length:25}, () => ({ x: Math.random()*24, y: 10000+Math.random()*20000 })), backgroundColor: 'rgba(0,0,0,0)', borderColor: 'rgba(0,0,0,0)', pointRadius: 0, showLine: false, _risoColor: '#6b93d6' },
      { data: Array.from({length:25}, () => ({ x: Math.random()*24, y: 20000+Math.random()*25000 })), backgroundColor: 'rgba(0,0,0,0)', borderColor: 'rgba(0,0,0,0)', pointRadius: 0, showLine: false, _risoColor: '#d45d5d' },
    ] };
    const doughnutData = { labels: ['Stocks','Bonds','Cash','Crypto','Real Estate'], datasets: [{ data: [35,25,15,15,10], backgroundColor: ['rgba(0,0,0,0)','rgba(0,0,0,0)','rgba(0,0,0,0)','rgba(0,0,0,0)','rgba(0,0,0,0)'], borderWidth: 0 }] };
    let multiSeries = false;

    Chart.register(RisographPlugin);
    let chart, currentType = 'line';

    function V(id) { const e = document.getElementById(id); return e ? parseFloat(e.value) : 0; }
    function C(id) { const e = document.getElementById(id); return e ? e.value : ''; }
    function B(id) { const e = document.getElementById(id); return e ? e.checked : false; }

    function apply() {
      const r = chart.options.plugins.risograph;
      r.halftone = {
        color: C('ht-color'), cellSize: V('ht-cs'), dotSizeRange: [0.6, V('ht-md')],
        noiseScale: 0.03, bleed: V('ht-bl'), squareThreshold: V('ht-sq'),
        densityPower: V('ht-dp'), densityFloor: V('ht-df'),
      };
      r.paper = {
        color: C('p-color'), fiberStrength: V('p-fb'), fiberAngle: V('p-fa'),
        toothStrength: V('p-to'), grainStrength: V('p-gr'), speckDensity: V('p-sp'), warmShift: V('p-ws'),
      };
      r._lineWidth = V('ht-lw');

      if (B('l2-on')) {
        r.layers = [
          { ...r.halftone, datasetIndex: 0 },
          { ...r.halftone, color: C('l2-color'), cellSize: V('l2-cs'),
            dotSizeRange: [0.6, V('l2-md')], densityPower: V('l2-dp'), densityFloor: V('l2-df'),
            offsetX: V('l2-ox'), offsetY: V('l2-oy'), datasetIndex: 0 },
        ];
      } else { delete r.layers; }

      chart.update('none');
    }

    // rAF debounced
    let _raf = false;
    function sched() { if (_raf) return; _raf = true; requestAnimationFrame(() => { _raf = false; apply(); }); }

    document.getElementById('btn-play').onclick = () => {
      document.getElementById('a-scrub').value = 0;
      document.getElementById('a-scrub-v').textContent = '0.00';
      RisographAnim.play(chart, V('a-dur') * 1000);
      // Sync scrub slider during animation
      const syncScrub = () => {
        const s = document.getElementById('a-scrub');
        s.value = RisographAnim.progress;
        document.getElementById('a-scrub-v').textContent = RisographAnim.progress.toFixed(2);
        if (RisographAnim.progress < 1) requestAnimationFrame(syncScrub);
      };
      requestAnimationFrame(syncScrub);
    };
    document.getElementById('btn-reset').onclick = () => {
      document.getElementById('a-scrub').value = 0;
      document.getElementById('a-scrub-v').textContent = '0.00';
      RisographAnim.reset(chart);
    };
    document.getElementById('a-scrub').addEventListener('input', function() {
      document.getElementById('a-scrub-v').textContent = parseFloat(this.value).toFixed(2);
      RisographAnim.scrub(chart, parseFloat(this.value));
    });
    document.getElementById('ms-on').addEventListener('change', function() {
      multiSeries = this.checked;
      createChart(currentType);
    });
    document.getElementById('btn-defaults').onclick = () => location.reload();

    const TRANS = 'rgba(0,0,0,0)';
    const risoBase = {
      title: '$10,000 \u00B7 7% Annual \u00B7 24 Years', yAxisTitle: 'Balance', xAxisTitle: 'Years',
      paper: { color: '#f0ebe1', fiberStrength: 0.45, fiberAngle: 0.15, toothStrength: 0.35, grainStrength: 0.25, speckDensity: 0.003, warmShift: 0.1 },
      halftone: { color: '#6b93d6', cellSize: 3, dotSizeRange: [0.6, 2.0], noiseScale: 0.03, bleed: 0.04, squareThreshold: 0.30, densityPower: 1.3, densityFloor: 0.08 },
    };

    function makeScales(type) {
      if (type === 'doughnut' || type === 'pie') return {};
      const font = { family: '"DM Serif Display", Georgia, serif', size: 14 };
      if (type === 'bar') return {
        x: { ticks: { color: TRANS, font }, grid: { color: TRANS }, border: { color: TRANS } },
        y: { ticks: { color: TRANS, font, callback: v => v }, grid: { color: TRANS }, border: { color: TRANS } },
      };
      if (type === 'scatter') return {
        x: { type: 'linear', min: 0, max: 24, ticks: { color: TRANS, font }, grid: { color: TRANS }, border: { color: TRANS } },
        y: { min: 10000, max: 55000, ticks: { color: TRANS, font, callback: v => `$${(v/1000).toFixed(0)}k` }, grid: { color: TRANS }, border: { color: TRANS } },
      };
      return { // line
        x: { type: 'linear', min: 0, max: 24, ticks: { stepSize: 4, color: TRANS, font }, grid: { color: TRANS }, border: { color: TRANS } },
        y: { min: 10000, max: 55000, ticks: { stepSize: 5000, color: TRANS, font, callback: v => `$${(v/1000).toFixed(0)}k` }, grid: { color: TRANS }, border: { color: TRANS } },
      };
    }

    function makeData(type) {
      if (type === 'bar') return multiSeries ? barMultiData : barData;
      if (type === 'scatter') return multiSeries ? scatterMultiData : scatterData;
      if (type === 'doughnut') return doughnutData;
      if (multiSeries) return { datasets: [
        { data: lineData, borderColor: TRANS, borderWidth: 0, fill: false, pointRadius: 0, tension: 0, _risoColor: '#6b93d6' },
        { data: lineData2, borderColor: TRANS, borderWidth: 0, fill: false, pointRadius: 0, tension: 0, _risoColor: '#e8a040' },
        { data: lineData3, borderColor: TRANS, borderWidth: 0, fill: false, pointRadius: 0, tension: 0, _risoColor: '#d45d5d' },
      ] };
      return { datasets: [{ data: lineData, borderColor: TRANS, borderWidth: 0, fill: false, pointRadius: 0, tension: 0 }] };
    }

    function createChart(type) {
      if (chart) chart.destroy();
      currentType = type;
      // Sync scrub slider (afterInit resets animation to progress=1)
      const scrubEl = document.getElementById('a-scrub');
      if (scrubEl) { scrubEl.value = 1; document.getElementById('a-scrub-v').textContent = '1.00'; }
      const titles = { line: '$10,000 \u00B7 7% Annual \u00B7 24 Years', bar: 'Quarterly Revenue', scatter: 'Portfolio Distribution', doughnut: 'Asset Allocation' };
      const yTitles = { line: 'Balance', bar: 'Revenue', scatter: 'Value', doughnut: '' };
      const xTitles = { line: 'Years', bar: 'Quarter', scatter: 'Years', doughnut: '' };

      chart = new Chart(document.getElementById('chart'), {
        type: type,
        data: makeData(type),
        options: {
          responsive: true, maintainAspectRatio: true, animation: false,
          layout: { padding: { top: 60, bottom: type === 'doughnut' ? 20 : 65, left: type === 'doughnut' ? 20 : 75, right: 20 } },
          scales: makeScales(type),
          plugins: {
            legend: { display: false }, tooltip: { enabled: false },
            risograph: { ...risoBase, title: titles[type], yAxisTitle: yTitles[type], xAxisTitle: xTitles[type] },
          },
        },
      });
    }

    // Chart type buttons
    document.querySelectorAll('.ct-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.ct-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        createChart(btn.dataset.type);
      });
    });

    document.fonts.ready.then(() => {
      createChart('line');

      // Wire all inputs (skip scrub slider and multi-series toggle — they have custom handlers)
      document.querySelectorAll('.cr input[type="range"]').forEach(el => {
        if (el.id === 'a-scrub') return;
        const vs = document.getElementById(el.id + '-v');
        el.addEventListener('input', () => { if (vs) vs.textContent = el.value; sched(); });
      });
      document.querySelectorAll('.cr input[type="color"]').forEach(el => el.addEventListener('input', sched));
      document.querySelectorAll('.cr input[type="checkbox"]').forEach(el => {
        if (el.id === 'ms-on') return;
        el.addEventListener('change', sched);
      });
    });
  </script>
</body>
</html>
